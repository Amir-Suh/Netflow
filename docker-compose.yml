services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      CLIENT_HTTP_ADDR: ":8081"
      NETFLOW_API_BASE_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: netflow
      RABBITMQ_DEFAULT_PASS: netflow
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # check_port_connectivity verifies the AMQP listener is accepting
      # connections, not just that the Erlang VM is running. Without this,
      # consumers can race and hit "connection refused" against an
      # otherwise "healthy" broker.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres-primary:
    image: bitnamilegacy/postgresql:16.6.0
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: netflow
      POSTGRESQL_PASSWORD: netflow
      POSTGRESQL_DATABASE: netflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflow -d netflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-primary-data:/bitnami/postgresql

  postgres-replica:
    image: bitnamilegacy/postgresql:16.6.0
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: 5432
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: netflow
      POSTGRESQL_PASSWORD: netflow
      POSTGRESQL_DATABASE: netflow
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netflow -d netflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-replica-data:/bitnami/postgresql

  categorizer-worker:
    build:
      context: ./workers/categorizer
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://netflow:netflow@rabbitmq:5672/
      RABBITMQ_EXCHANGE: netflow.events
      RABBITMQ_QUEUE: transactions.ingested
      DATABASE_URL: postgres://netflow:netflow@postgres-primary:5432/netflow?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  arbitrage-worker:
    build:
      context: ./workers/arbitrage
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://netflow:netflow@rabbitmq:5672/
      RABBITMQ_EXCHANGE: netflow.events
      ARBITRAGE_QUEUE: transactions.arbitrage
      DATABASE_URL: postgres://netflow:netflow@postgres-primary:5432/netflow?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  quant-worker:
    build:
      context: ./workers/quant
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://netflow:netflow@rabbitmq:5672/
      RABBITMQ_EXCHANGE: netflow.events
      DATABASE_URL: postgres://netflow:netflow@postgres-primary:5432/netflow?sslmode=disable
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq-data:
  postgres-primary-data:
  postgres-replica-data:
